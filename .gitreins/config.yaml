guards:
  secrets: true
  lint: true
  lsp: true
  lsp_tools:
  - pylsp
  tests: true
  test_mode: full
  # Under fleet load the full suite (4377 tests) exceeds 600s and gitreins
  # fails open on hook_timeout; measured >14min at loadavg ~30 on 16 cores
  # (2026-09-30 commit attempt), while the same command finishes in ~290s on a
  # quiet box. 1800s keeps the gate real instead of failing open, and stays
  # under hook_timeout below. Raise hook_timeout with it.
  test_timeout: 1800
  hook_timeout: 2400
  # DEPS-005 (2026-10-26): this pointed at ./.venv/bin/pytest, which does not
  # exist in this clone — .venv/ is a 37-dist runtime-only venv owned by the
  # live game bridge / MCP / console daemons (scripts/game_bridge.py, started
  # 6d ago) and carries no pytest and no dev tooling, so the tests cell could
  # never execute: 3 guard runs on disk recorded `exit_code=127  skip_reason=
  # test runner './.venv/bin/pytest' not found` and committed anyway. ./venv/
  # (CPython 3.11, the CI interpreter) is a complete env: 264 dists, pytest
  # 9.1.1, and it satisfies requirements.txt + requirements-dev.txt 14/14 after
  # the DEPS-005 reconciliation. Rebuilding .venv/ in place needs a maintenance
  # window (live daemons) and is its own row; see
  # docs/dependency_reconcile_20261026.md.
  # INT-GL-3 (2026-11-20): the command now runs through
  # scripts/gitreins_tests.sh, which resolves a REAL pytest in whatever checkout
  # the guard lands in. The bare ./venv/bin/pytest above was only correct in a
  # provisioned operator clone: a gitreins judge worktree is a bare checkout of a
  # commit, so verdict 2026-10-30/126d061b recorded the tests cell as SKIPPED
  # ("test runner './venv/bin/pytest' not found") — a judge run that graded no
  # tests and still reported tier1 green. The resolver probes ./venv/bin/pytest,
  # ./.venv/bin/python -m pytest, then python/python3 -m pytest, each with
  # `--version` so a stale shebang or half-built venv falls through instead of
  # dying mid-suite; when nothing is usable it exits 127 naming every candidate,
  # so an unprovisioned environment reads as a loud gap, never as a pass.
  test_command: ./scripts/gitreins_tests.sh -x --tb=short
  static_analysis: true
  static_analysis_tools:
    python:
    - mypy
  # GUARD-1: kept true BY DESIGN — gitreins's allow_skips flag cannot
  # distinguish a benign empty-scope skip ("lint=no staged files", produced by
  # every bookkeeping-only commit) from a real degradation, and exits nonzero
  # on both. Enforcement lives in scripts/hooks/pre-commit instead, which
  # rejects the hook_timeout fail-open, any non-benign skip, and stale runs.
  allow_skips: true
  # INT-GL-2 (2026-10-30): .env.example is a TEMPLATE that must stay tracked —
  # its two values are word-shaped placeholders (30 and 25 chars of the shape
  # "xx-xx-xxxx-xxxxxxxxxx-xxx-xxxx", i.e. no high-entropy run, no live key).
  # Its PATH, however, matches the built-in scanner's credential-store class
  # ('(.env.*)'), which fails the secrets cell REGARDLESS of content — and by
  # design that class is evaluated BEFORE the .gitleaks.toml allowlist ("an
  # allowlist path may exempt content findings, but it must NOT silence the
  # path class"), so a .gitleaks entry cannot clear it. This is the documented
  # knob (REVIEW-GITREINS-027) and it is deliberately not silent: the pass
  # carries "sensitive-path override applied: .env.example" in the cell's
  # evidence. Rationale recorded on board row INT-GL-2.
  sensitive_paths:
    allow:
    - .env.example
evaluator:
  max_iterations: 300
  max_time: 60m
  max_input_tokens: 16M
  max_output_tokens: 4M
  tool_call_weight: 0.1
  fast_track: auto
defaults:
  max_iterations: 300
  model: deepseek-v4-flash
  provider: deepseek-foreman
  api_key_env: GITREINS_LLM_API_KEY
history:
  enabled: true
  storage: git
  max_verdicts: 1000
worktree_fleet:
  disk_ceiling_mb: 4096
resolution:
  enabled:
    cli: false
    mcp: false
    predispatch: false
    judge_prescreen: false
  model: typesafe/jev-1.13
  tokens_max: 28000
  bands:
    resolved_at: 0.85
    review_at: 0.5
  egress_exclude: []
pipeline:
  stages:
  - id: tier1
    parallel: true
    'on':
    - pre-commit
    - pre-eval
    steps:
    - id: secrets
      type: script
      run: "if command -v gitleaks >/dev/null 2>&1; then _glcfg=\"$(mktemp -t gitreins-gitleaks-XXXXXX.toml)\"; cat > \"$_glcfg\" <<GITREINS_GITLEAKS_CFG\n# Generated by GitReins for the Tier 1 secrets step (TRUST-002).\n# Not written into the repo: the step pipes it through a temp file.\n[extend]\npath = \"$PWD/.gitleaks.toml\"\n\n[allowlist]\ndescription = \"GitReins harness state \u2014 never graded\"\npaths = [\n  '''(^|/)\\.gitreins/.*''',\n]\nGITREINS_GITLEAKS_CFG\necho \"secrets: scanners=gitleaks+builtin cross-check\"; _gr_nice=\"nice -n 10\"; if nice -n 10 true >/dev/null 2>&1; then echo \"scanners: nice=nice -n 10\"; else _gr_nice=\"\"; echo \"scanners: nice unavailable (nice -n 10 did not run); running at default priority\"; fi; $_gr_nice gitleaks detect --source . --no-git --no-banner --no-color --config \"$_glcfg\"; _glrc=$?; rm -f \"$_glcfg\"; if [ \"$_glrc\" -eq 0 ]; then echo \"secrets: gitleaks: clean\"; else echo \"secrets: gitleaks: findings found (exit $_glrc)\"; echo \"\
        secrets: harness state excluded from gitleaks scope (.gitreins/**)\"; fi; else _glrc=0; echo \"secrets: scanners=builtin cross-check only (gitleaks not on PATH)\"; echo \"secrets: gitleaks: not on PATH\"; fi; g1=$_glrc; PYTHONPATH=\"/home/kara/.local/share/pipx/venvs/gitreins/lib/python3.14/site-packages\" /home/kara/.local/share/pipx/venvs/gitreins/bin/python -c \"from engine.guard_manager import GuardManager; import sys; gm = GuardManager('.'); r = gm._builtin_secrets_scan(staged_only=False); print('secrets: builtin cross-check: ' + r.output); print('secrets: builtin cross-check status: ' + (r.scanners[0][1] if r.scanners else 'clean')); sys.exit(1 if not r.passed else 0)\"; g2=$?; [ \"$g1\" -eq 0 ] && [ \"$g2\" -eq 0 ]"
      on_fail: continue
      # INT-GL-3: 600 -> 900. Measured on this worktree (506 MB incl. a 469 MB
      # ./venv, 919-925 files actually in gitleaks' scope, ~19 MB):
      #   quiet                                     5.22 s
      #   4 x nice-10 CPU workers, loadavg 15-27    7.14 / 13.16 / 8.68 s
      #   4 concurrent secrets scans, same load     12.12-12.56 s each
      #   4 x O_DIRECT readers over 2 GB            4.13-4.44 s
      #   bare judge-like tree (38 MB, no venv)      3.77-4.09 s
      # Worst case measured = 13.16 s, so 900 s is ~68x headroom, and still
      # >=7.5x the >120 s stall the historical verdicts hit under host-wide I/O
      # starvation (2026-11-01/4196a31e, 86f5f7f4, 9e93beee: data.timed_out=true,
      # timeout_s=120, empty output). hook_timeout (2400) stays above both this
      # budget and the tests step's 1800.
      # Re-measured 2026-11-20 on a host already at loadavg ~40 (fleet load, not
      # quiet): baseline 14.06 s; with 4 extra nice-10 CPU workers pinned for the
      # run, 16.84 / 14.40 / 8.12 s. All 4 runs exit 0, zero timed_out; new worst
      # case 16.84 s => 900 s is ~53x headroom. Shrinking this budget back toward
      # the historical 120 s is what produced the verdicts above.
      #
      # CRITICAL SHAPE: this timeout is carried ONLY by this checked-in plan
      # copy. engine.pipeline.tier1_plan() emits the secrets step WITHOUT a
      # `timeout` key and engine.pipeline._run_script_step falls back to
      # `step_def.get("timeout", 120)` (pipeline.py:958/976), and
      # load_pipeline_config() only generates that plan when the config has NO
      # `pipeline:` key (pipeline.py:2115-2147). So deleting this block — or
      # judging a tree whose config predates it — silently reverts the cell to
      # 120 s. That is exactly what produced every 120 s verdict listed above.
      # Verify after any edit to this file by asking the DEPLOYED engine what it
      # would actually run (never by reading this file): this prints each tier1
      # step's effective timeout, i.e. `secrets 900` / `lint 120` / `tests 1800`:
      #   PYTHONPATH=<pipx venv>/lib/python3.14/site-packages \
      #     <pipx venv>/bin/python -c "from engine.pipeline import \
      #     load_pipeline_config as L; s=[x for x in L('.')['pipeline']['stages'] \
      #     if x['id']=='tier1'][0]['steps']; [print(x['id'], x.get('timeout',120)) \
      #     for x in s]"
      timeout: 900
    # QA-AI-PLAYS-POKE-029 moved ruff off .gitignore discovery (respect-gitignore=false)
    # so the lint gate sees every TRACKED file. `ruff check .` then also started linting
    # gitignored host artifacts sitting in the operator's checkout (db_count.py,
    # diag_*.py, tools/foreman-diagnostics/_*.py), failing tier1 on files CI never sees.
    # The gate now names the same scope CI uses (.github/workflows/ci.yml:84-85), so a
    # local guard verdict and the CI verdict cannot disagree about lint.
    - id: lint
      type: script
      run: 'if command -v ruff >/dev/null 2>&1; then _gr_nice="nice -n 10"; if nice -n 10 true >/dev/null 2>&1; then echo "scanners: nice=nice -n 10"; else _gr_nice=""; echo "scanners: nice unavailable (nice -n 10 did not run); running at default priority"; fi; $_gr_nice ruff check src/ tests/ --quiet; else echo "GITREINS_SKIP: lint=no linter on PATH (ruff not found)"; exit 0; fi'
    - id: tests
      type: script
      run: '_gr_nice="nice -n 10"; if nice -n 10 true >/dev/null 2>&1; then echo "scanners: nice=nice -n 10"; else _gr_nice=""; echo "scanners: nice unavailable (nice -n 10 did not run); running at default priority"; fi; $_gr_nice sh -c ''./scripts/gitreins_tests.sh -x --tb=short'''
      analysis_cmd: ./scripts/gitreins_tests.sh -x --tb=short
      env:
        GITREINS_TIER1: '1'
      timeout: 1800
    coverage: secrets+lint+tests
    degraded: false
    skipped_steps: []
    degradation_reason: ''
  - id: tier2
    type: ai_eval
    'on':
    - pre-eval
    condition: 'true'
    max_iterations: -1
    tools:
    - read_file
    - run_command
    - search_pattern
    - read_diff
    - sandbox

guards:
  secrets: true
  lint: true
  lsp: true
  lsp_tools:
  - pylsp
  tests: true
  test_mode: full
  # Under fleet load the full suite (4377 tests) exceeds 600s and gitreins
  # fails open on hook_timeout; measured >14min at loadavg ~30 on 16 cores
  # (2026-09-30 commit attempt), while the same command finishes in ~290s on a
  # quiet box. 1800s keeps the gate real instead of failing open, and stays
  # under hook_timeout below. Raise hook_timeout with it.
  test_timeout: 1800
  hook_timeout: 2400
  # DEPS-005 (2026-10-26): this pointed at ./.venv/bin/pytest, which does not
  # exist in this clone — .venv/ is a 37-dist runtime-only venv owned by the
  # live game bridge / MCP / console daemons (scripts/game_bridge.py, started
  # 6d ago) and carries no pytest and no dev tooling, so the tests cell could
  # never execute: 3 guard runs on disk recorded `exit_code=127  skip_reason=
  # test runner './.venv/bin/pytest' not found` and committed anyway. ./venv/
  # (CPython 3.11, the CI interpreter) is a complete env: 264 dists, pytest
  # 9.1.1, and it satisfies requirements.txt + requirements-dev.txt 14/14 after
  # the DEPS-005 reconciliation. Rebuilding .venv/ in place needs a maintenance
  # window (live daemons) and is its own row; see
  # docs/dependency_reconcile_20261026.md.
  test_command: ./venv/bin/pytest -x --tb=short
  static_analysis: true
  static_analysis_tools:
    python:
    - mypy
  # GUARD-1: kept true BY DESIGN — gitreins's allow_skips flag cannot
  # distinguish a benign empty-scope skip ("lint=no staged files", produced by
  # every bookkeeping-only commit) from a real degradation, and exits nonzero
  # on both. Enforcement lives in scripts/hooks/pre-commit instead, which
  # rejects the hook_timeout fail-open, any non-benign skip, and stale runs.
  allow_skips: true
  # INT-GL-2 (2026-10-30): .env.example is a TEMPLATE that must stay tracked —
  # its two values are word-shaped placeholders (30 and 25 chars of the shape
  # "xx-xx-xxxx-xxxxxxxxxx-xxx-xxxx", i.e. no high-entropy run, no live key).
  # Its PATH, however, matches the built-in scanner's credential-store class
  # ('(.env.*)'), which fails the secrets cell REGARDLESS of content — and by
  # design that class is evaluated BEFORE the .gitleaks.toml allowlist ("an
  # allowlist path may exempt content findings, but it must NOT silence the
  # path class"), so a .gitleaks entry cannot clear it. This is the documented
  # knob (REVIEW-GITREINS-027) and it is deliberately not silent: the pass
  # carries "sensitive-path override applied: .env.example" in the cell's
  # evidence. Rationale recorded on board row INT-GL-2.
  sensitive_paths:
    allow:
    - .env.example
evaluator:
  max_iterations: 300
  max_time: 60m
  max_input_tokens: 16M
  max_output_tokens: 4M
  tool_call_weight: 0.1
  fast_track: auto
defaults:
  model: deepseek-v4-flash
  provider: deepseek-foreman
  api_key_env: GITREINS_LLM_API_KEY
history:
  enabled: true
  storage: git
  max_verdicts: 1000
worktree_fleet:
  disk_ceiling_mb: 4096
resolution:
  enabled:
    cli: false
    mcp: false
    predispatch: false
    judge_prescreen: false
  model: typesafe/jev-1.13
  tokens_max: 28000
  bands:
    resolved_at: 0.85
    review_at: 0.5
  egress_exclude: []
pipeline:
  stages:
  - id: tier1
    parallel: true
    'on':
    - pre-commit
    - pre-eval
    steps:
    - id: secrets
      type: script
      run: "if command -v gitleaks >/dev/null 2>&1; then _glcfg=\"$(mktemp -t gitreins-gitleaks-XXXXXX.toml)\"; cat > \"$_glcfg\" <<GITREINS_GITLEAKS_CFG\n# Generated by GitReins for the Tier 1 secrets step (TRUST-002).\n# Not written into the repo: the step pipes it through a temp file.\n[extend]\npath = \"$PWD/.gitleaks.toml\"\n\n[allowlist]\ndescription = \"GitReins harness state \u2014 never graded\"\npaths = [\n  '''(^|/)\\.gitreins/.*''',\n]\nGITREINS_GITLEAKS_CFG\necho \"secrets: scanners=gitleaks+builtin cross-check\"; _gr_nice=\"nice -n 10\"; if nice -n 10 true >/dev/null 2>&1; then echo \"scanners: nice=nice -n 10\"; else _gr_nice=\"\"; echo \"scanners: nice unavailable (nice -n 10 did not run); running at default priority\"; fi; $_gr_nice gitleaks detect --source . --no-git --no-banner --no-color --config \"$_glcfg\"; _glrc=$?; rm -f \"$_glcfg\"; if [ \"$_glrc\" -eq 0 ]; then echo \"secrets: gitleaks: clean\"; else echo \"secrets: gitleaks: findings found (exit $_glrc)\"; echo \"\
        secrets: harness state excluded from gitleaks scope (.gitreins/**)\"; fi; else _glrc=0; echo \"secrets: scanners=builtin cross-check only (gitleaks not on PATH)\"; echo \"secrets: gitleaks: not on PATH\"; fi; g1=$_glrc; PYTHONPATH=\"/home/kara/.local/share/pipx/venvs/gitreins/lib/python3.14/site-packages\" /home/kara/.local/share/pipx/venvs/gitreins/bin/python -c \"from engine.guard_manager import GuardManager; import sys; gm = GuardManager('.'); r = gm._builtin_secrets_scan(staged_only=False); print('secrets: builtin cross-check: ' + r.output); print('secrets: builtin cross-check status: ' + (r.scanners[0][1] if r.scanners else 'clean')); sys.exit(1 if not r.passed else 0)\"; g2=$?; [ \"$g1\" -eq 0 ] && [ \"$g2\" -eq 0 ]"
      on_fail: continue
      timeout: 600
    - id: lint
      type: script
      run: 'if command -v ruff >/dev/null 2>&1; then _gr_nice="nice -n 10"; if nice -n 10 true >/dev/null 2>&1; then echo "scanners: nice=nice -n 10"; else _gr_nice=""; echo "scanners: nice unavailable (nice -n 10 did not run); running at default priority"; fi; $_gr_nice ruff check . --quiet; else echo "GITREINS_SKIP: lint=no linter on PATH (ruff not found)"; exit 0; fi'
    - id: tests
      type: script
      run: '_gr_nice="nice -n 10"; if nice -n 10 true >/dev/null 2>&1; then echo "scanners: nice=nice -n 10"; else _gr_nice=""; echo "scanners: nice unavailable (nice -n 10 did not run); running at default priority"; fi; $_gr_nice sh -c ''./venv/bin/pytest -x --tb=short'''
      analysis_cmd: ./venv/bin/pytest -x --tb=short
      env:
        GITREINS_TIER1: '1'
      timeout: 1800
    coverage: secrets+lint+tests
    degraded: false
    skipped_steps: []
    degradation_reason: ''
  - id: tier2
    type: ai_eval
    'on':
    - pre-eval
    condition: 'true'
    max_iterations: -1
    tools:
    - read_file
    - run_command
    - search_pattern
    - read_diff
    - sandbox

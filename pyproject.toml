[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ptp-01x-pokemon-ai"
version = "1.2.0"
description = "PTP-01X Autonomous Pokemon AI Benchmarking System"
readme = "README.md"
requires-python = ">=3.11"  # 3.10 dropped: dev tooling (pre-commit>=4.7.0) requires >=3.11, so uv.lock is unsolvable at 3.10 (SUP-DEPS-20261022-AIP); runtime envs are CI 3.11 / venv 3.13
dependencies = [
    "pyboy>=1.0.0,<2.8.0",  # blocking: log renumber + save-state format — see requirements.txt

    # openai / streamlit / pandas / matplotlib were declared here but never
    # imported anywhere in the repo; removed in SUP-DEPS batch 4 (2026-10-11).
    # See requirements.txt for the evidence and how to re-add them.
    "anthropic>=2.3.0",  # 1.x→2.x verified: default API-version bump only; see requirements.txt
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "tqdm>=4.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "opencv-python-headless>=4.8.0",
    "psutil>=5.9.0",
    "fastapi>=0.162.0",  # bumped 0.152→0.162 on 2026-10-25 (SUP-DEPS-20261022-AIP)
    "uvicorn>=0.24.0",
    "websockets>=12.0",
    "prometheus-client",  # Prometheus metrics endpoint and runtime instrumentation
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1,<9.2",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "pytest-benchmark>=4.0",
    "pytest-timeout>=2.1",
    "requests-mock>=1.12",
    "opencv-python-headless>=4.8.0",
    "psutil>=5.9.0",
    "fastapi>=0.152.0",  # bumped 0.146→0.152 on 2026-10-20 (SUP-DEPS-20261020-AIP)
    "black>=23.0",
    "mypy>=1.0",
    "flake8>=6.0",
    # Exact pin, deliberately not a range: CI lints with ruff==0.15.22 and ruff
    # renames/retires rule codes between releases, so any other version can
    # produce a different verdict than the gate. A fresh `pip install -e '.[dev]'`
    # must resolve the same linter CI runs.
    "ruff==0.15.22",
    "pre-commit>=4.7.0",
]

[tool.setuptools]
packages = [
    "src",
    "src.core",
    "src.dashboard",
    "src.db",
    "src.observability",
    "src.ptp_cli",
    "src.schemas",
    "src.vision",
]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-p", "no:warnings",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "heavy: marks tests as heavy (slow/integration; deselect with '-m \"not heavy\"' for the fast tier)",
    "fast: marks tests as fast (default tier; selected by '-m \"not heavy\"')",
    "live: marks tests that require a real API or ROM connection (deselect with '-m \"not live\"')",
    "vision: marks tests as vision-related",
    "ai: marks tests as AI-related",
    "live_api: marks tests that require live API keys (OPENROUTER_API_KEY)",
    "asyncio: marks tests as async (uses pytest-asyncio or asyncio)",
    "rom: marks tests that require a ROM file at data/rom/pokemon_red.gb",
]
junit_family = "xunit2"
cache_dir = ".pytest_cache"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)s)"
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "src/simple_test.py",
    "src/test_pyboy.py",
    "src/test_all_roms.py",
]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
show_missing = true
fail_under = 0

[tool.black]
line-length = 88
target-version = ["py310"]
include = "\\.pyi?$"
extend-exclude = '''
/(
    \\.eggs
    | \\.git
    | \\.hg
    | \\.mypy_cache
    | \\.tox
    | \\.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = true
disallow_untyped_defs = false

[tool.ruff]
# CI runs `ruff check src/ tests/` (see .github/workflows/ci.yml) with no config of
# its own, so these values are what the gate actually enforces. 88 also matches the
# pycodestyle and flake8 pins in setup.cfg - the lint and format gates must agree,
# because `ruff format` emits 88-character lines on purpose.
line-length = 88

# The lint gate must see every file git tracks, but ruff's discovery honours
# .gitignore and does NOT exempt tracked paths (unlike `git ls-files`, there is no
# "already in the index" escape hatch).  This repo's .gitignore hides a broad glob -
# line 152 `_*.py` - which silently swallowed 9 tracked files (every package
# `__init__.py` plus src/ptp_cli/__main__.py), and a name-specific entry hid a 10th
# (web_viewer.py).  `ruff check src/ tests/` therefore linted 192 of the 201 tracked
# files under those roots and reported "All checks passed!" without ever reading
# them.  Turning gitignore support off at the config level makes the CLI and CI agree
# on the index, which is what `--no-respect-gitignore` was doing by hand: with it set,
# `ruff check --show-files .` enumerates all 243 tracked .py files.  It does not widen
# the rule set or narrow any exclusion ruff applies by default (`.git`, `venv`,
# `build`, ...), and .gitignore is left untouched for the other tooling that relies
# on it.
respect-gitignore = false

[tool.ruff.lint]
# The retired pyproject flake8 table ignored E203 and W503. Neither is carried here:
# measured with ruff 0.15.22, `W503` is not a valid selector at all (ruff hard-fails
# with "Unknown rule selector W503" if it appears in `ignore`), and E203 is
# preview-gated and fires 0 times on this tree (`ruff check --preview --select E203`).
# F401 in __init__.py IS load-bearing - the package __init__ files re-export names
# without `__all__`, which measures 26 findings without this ignore and 0 with it
# (ruff check . --no-respect-gitignore).
per-file-ignores = { "__init__.py" = ["F401"] }
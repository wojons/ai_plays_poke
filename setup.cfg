[pycodestyle]
# pylsp's lint plugin (pycodestyle) defaults to a 79-character line limit, which is two
# under this repo's own standard: ruff's line-length is 88 ([tool.ruff] in pyproject.toml)
# and flake8's max-line-length is 88 ([flake8] below). With the default unset, the guard's
# LSP step flags every line between 80 and 88 characters - including lines nobody touched -
# and the "fix" would directly contradict `ruff format`, which produces 88-character lines
# on purpose. The two gates have to agree, so pycodestyle is pinned to the repo's own
# number here.
max-line-length = 88

[flake8]
# flake8 does NOT read pyproject.toml - its config lives in setup.cfg, .flake8 or tox.ini,
# so a [tool.flake8] table in pyproject.toml is silently inert (QA-AI-PLAYS-POKE-27).
# Keep every value here in lockstep with [tool.ruff] in pyproject.toml: E203/W503 are live
# pycodestyle rules this repo's formatting intentionally trips (95 E203 and 204 W503
# findings without the ignore), and the package __init__ files re-export names without
# `__all__` (28 F401 findings without the per-file ignore).
max-line-length = 88
extend-ignore = E203,W503
per-file-ignores =
    __init__.py:F401
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .venv,
    *.egg-info

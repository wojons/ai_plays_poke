[pycodestyle]
# pylsp's lint plugin (pycodestyle) defaults to a 79-character line limit, which is two
# under this repo's own standard: ruff's line-length is 88 and flake8's max-line-length is
# 88 (both in pyproject.toml). With the default unset, the guard's LSP step flags every
# line between 80 and 88 characters - including lines nobody touched - and the "fix" would
# directly contradict `ruff format`, which produces 88-character lines on purpose. The two
# gates have to agree, so pycodestyle is pinned to the repo's own number here.
max-line-length = 88

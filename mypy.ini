[mypy]
python_version = 3.13
ignore_missing_imports = True
disallow_untyped_defs = False
check_untyped_defs = False
warn_unused_ignores = False
warn_return_any = True
# Pre-existing untyped debt outside src/ (tests/, vendored venv/, root utility
# scripts + cron_runner.py) — the gitreins static_analysis lane runs
# `mypy --no-error-summary --explicit-package-bases .`, excluding these keeps
# the guard deterministic (strict on src/) instead of fail-open via its 120s
# timeout or fail-closed on ~2500 legacy annotations.
# T134 gate repair: per-file `# mypy: no-warn-unused-ignores` in
# src/core/ai_client.py + src/core/game_loop.py lets the strict run keep the
# load-bearing ignores canonical mypy needs (unused-ignore only fires because
# CLI --strict re-enables warn_unused_ignores over this ini).
# The lane passes `.` as the source root, so file paths reach the exclude
# matcher as `./cron_runner.py`. A `^...$`-anchored alternative never matches
# that form, so the documented intent silently lapsed. Every alternative now
# carries the same `(^|/)` path-form-tolerant prefix mypy's own examples use
# (INT-GATE-1). All eight names are top-level files in this repo, so the prefix
# widens the match by path form only: it puts no new file out of the guard's view.
exclude = (^|/)(live_viewer\.py|diag_.*\.py)$|^tests/|^venv/|(^|/)(simple_viewer|make_run_video|dream_gen|_analyze_run|_analyze_log|ram_map_server|cron_runner|web_viewer)\.py$
# docs/handbook/build_book.py loads its sibling `sheet_style` through a runtime
# sys.path.insert(), which mypy cannot follow from the `.` source root: `para()`
# and `fig()` degrade to Any, so every `-> str` helper they feed loses its
# declared type — RELEASE-011's "Returning Any from function declared to return
# str" at build_book.py:930, although para() itself is annotated `-> str`.
# Listing the sibling directory makes those annotations visible instead of masked.
mypy_path = $MYPY_CONFIG_FILE_DIR/docs/handbook

# cron_runner.py is the runtime entry point: scripts/jev_projection_probe.py and the
# test suite import it, and mypy's `exclude` only filters directory crawling — it
# never drops a module reached through an import. So the file-level exclusion above
# cannot keep cron_runner.py out of the build, and what leaks through is not a defect
# but the advisory `annotation-unchecked` note (nine annotated locals inside untyped
# functions; checking those bodies is separate work and surfaces unrelated
# name-defined errors). Silence exactly that note code for exactly that module —
# every real error in cron_runner.py still reports, and no other file is affected.
[mypy-cron_runner]
disable_error_code = annotation-unchecked

[mypy]
python_version = 3.13
ignore_missing_imports = True
disallow_untyped_defs = False
check_untyped_defs = False
warn_unused_ignores = False
warn_return_any = True
# Gitignored diagnostic/utility scripts (live_viewer.py, diag_*.py) are local
# tooling, not part of the shipped package — keep them out of the guard's
# static_analysis scope (pre-existing guard FAIL class since T31).
exclude = (^|/)(live_viewer\.py|diag_.*\.py)$


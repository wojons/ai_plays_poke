# GitReins — gitleaks configuration
# Auto-generated by 'gitreins init'. Edit to add project-specific exclusions.
# See: https://github.com/gitleaks/gitleaks#configuration

[allowlist]
description = "Auto-generated by gitreins init — skip dependency dirs, docs, specs"

# INT-GL-1: the Tier 1 full-tree secrets scan grades EVERY file in the tree —
# the built-in cross-check walks the workdir and gitleaks runs `--no-git`, so
# neither honours .gitignore. Deployment artifacts that never enter git were
# therefore graded as if they were repo code: local env files (live keys),
# generated review reports (base64 image payloads that trip the AWS-key
# pattern), and the dashboard's static bundle (an embedded default API key).
#
# NOTE the generator wrote `\\.` for the entries above — inside a TOML literal
# string (`'''`) that is a two-character escape sequence, so those entries match
# a literal backslash. Entries added here use single-backslash regexes, which is
# what RE2 (gitleaks) and Python re (the built-in scanner) actually compile.
# Paths are repo-relative with forward slashes, matched with `search()`.
paths = [
  '''.git/''',
  '''.gitreins/''',
  '''.gitreins/history/''',
  '''.*\\.log$''',
  '''.venv/''',
  '''venv/''',
  '''__pycache__/''',
  '''.*\\.egg-info/''',
  '''dist/''',
  '''build/''',
  '''.mypy_cache/''',
  '''.pytest_cache/''',
  '''.ruff_cache/''',
  '''(^|/)\.env$''',
  '''(^|/)\.env\.bak-.*$''',
  '''(^|/)review_.*\.html$''',
  '''(^|/)src/dashboard/static/.*''',
]

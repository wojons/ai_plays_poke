# GitReins — gitleaks configuration
# Auto-generated by 'gitreins init'. Edit to add project-specific exclusions.
# See: https://github.com/gitleaks/gitleaks#configuration

[allowlist]
description = "Auto-generated by gitreins init — skip dependency dirs, docs, specs"

# INT-GL-1: the Tier 1 full-tree secrets scan grades EVERY file in the tree —
# the built-in cross-check walks the workdir and gitleaks runs `--no-git`, so
# neither honours .gitignore. Deployment artifacts that never enter git were
# therefore graded as if they were repo code: local env files (live keys),
# generated review reports (base64 image payloads that trip the AWS-key
# pattern), and the dashboard's static bundle (an embedded default API key).
#
# NOTE the generator wrote `\\.` for the entries above — inside a TOML literal
# string (`'''`) that is a two-character escape sequence, so those entries match
# a literal backslash. Entries added here use single-backslash regexes, which is
# what RE2 (gitleaks) and Python re (the built-in scanner) actually compile.
# Paths are repo-relative with forward slashes, matched with `search()`.
#
# INT-GL-2 (2026-10-30): the two broad harness-state entries added under
# INT-GL-1 ('''\.gitreins/''' and '''\.gitreins/history/''') were REMOVED.
# Measured, both trees, `gitleaks detect --no-git` — the exact mode this scan
# runs — WITH the entries deleted:
#   * this worktree: 27,665,541 bytes scanned (was 15,623,594 with them), clean
#   * main clone /home/kara/ai_plays_poke: 407,784,243 bytes scanned
#     (was 384,313,362), clean, incl. 17 MB history + 8.7 MB guard logs
# and `--no-git` OFF (full history) is clean too. So nothing under .gitreins/
# trips a rule, and the entries were dead scope-narrowing, not a false-positive
# fix.
# They also could never have caused the INT-GL-2 symptom: the judge renders its
# OWN config (engine.guard_manager.harness_scan_gitleaks_config), which always
# allowlists HARNESS_STATE_DIRS = (".gitreins",), and the built-in scanner
# skips _is_harness_state_path() unconditionally — so .gitreins/** is out of
# scope for every judge run with or without these lines. What DID read as the
# cause was the step's first output line, an unconditional informational echo
# ("secrets: harness state excluded from gitleaks scope"), which the verdict
# summary prints after the ✓/✗ marker — that is upstream cosmetic evidence and
# is filed on the row, not worked around here.
# Consequence of removing them: the repo config now declares the whole tree in
# scope and agrees with nothing narrower. If a real false positive ever appears
# under .gitreins/, pin the finding TEXT in [allowlist].regexes (option (c) of
# INT-GL-2) instead of re-blanket-excluding the harness dir.
paths = [
  '''.git/''',
  '''.*\\.log$''',
  '''.venv/''',
  '''venv/''',
  '''__pycache__/''',
  '''.*\\.egg-info/''',
  '''dist/''',
  '''build/''',
  '''.mypy_cache/''',
  '''.pytest_cache/''',
  '''.ruff_cache/''',
  '''(^|/)\.env$''',
  '''(^|/)\.env\.bak-.*$''',
  '''(^|/)review_.*\.html$''',
  '''(^|/)src/dashboard/static/.*''',
]
